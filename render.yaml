# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  # Read-only home page (plain HTML, no keys needed)
  - type: web
    runtime: static
    name: markettide-rag-home
    staticPublishPath: ./site
    buildCommand: ""

  # TideBot: the Streamlit RAG chatbot
  - type: web
    runtime: python
    name: tidebot
    plan: free
    buildCommand: pip install -r requirements.txt && python chatbot/download_models.py
    startCommand: streamlit run chatbot/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: TIDEBOT_RERANK
        value: "0"        # saves memory on the 512 MB free plan
      - key: GROQ_API_KEY
        sync: false        # set the value in the Render dashboard, never in git
