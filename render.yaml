# Render Blueprint for Standalone RAG Chatbot
services:
  - type: web
    runtime: python
    name: markettide-rag-chatbot
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false
