# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  # Read-only home page (plain HTML, no keys needed)
  - type: web
    runtime: static
    name: markettide-rag-home
    staticPublishPath: ./site
    buildCommand: ""
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
  # The Streamlit chatbot will be added here as a second service once it is built.
