<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1d">
<title>MarketTide — Executive Workstation &amp; Spatial RAG Terminal</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="market-tide-bus.js"></script>
<style>
  /* -------------------------------------------------------------------------
     OBSIDIAN DARK TERMINAL PALETTE (#0a0f1d) · PRD Theme 1
  ------------------------------------------------------------------------- */
  :root {
    --c-bg: #0a0f1d;
    --c-surface: #1e293b;
    --c-surface2: #0f172a;
    --c-ink: #f8fafc;
    --c-muted: #94a3b8;
    --c-border: #334155;
    --c-cyan: #06b6d4;
    --c-amber: #f97316;
    --c-green: #10b981;
    --c-red: #ef4444;
    --font-sans: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    color-scheme: dark;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: var(--c-bg);
    color: var(--c-ink);
    font-family: var(--font-sans);
  }

  /* -------------------------------------------------------------------------
     TERMINAL EXECUTIVE HEADER HUD
  ------------------------------------------------------------------------- */
  .terminal-bar {
    height: 52px;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--c-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1.25rem;
    z-index: 100;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 0.65rem;
  }

  .brand-icon {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--c-cyan), #3b82f6);
    display: grid;
    place-items: center;
    color: #ffffff;
    font-size: 0.85rem;
    font-weight: 700;
  }

  .brand-title {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--c-ink);
    text-decoration: none;
    letter-spacing: -0.01em;
  }

  .terminal-badge {
    background: rgba(6, 182, 212, 0.12);
    color: var(--c-cyan);
    font-size: 0.7rem;
    font-weight: 600;
    font-family: var(--font-mono);
    padding: 0.15rem 0.5rem;
    border-radius: 9999px;
    border: 1px solid rgba(6, 182, 212, 0.25);
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }

  .pulse-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--c-cyan);
    box-shadow: 0 0 8px var(--c-cyan);
  }

  /* View Mode Toggles */
  .view-toggles-strip {
    display: flex;
    align-items: center;
    background: rgba(10, 15, 29, 0.8);
    border: 1px solid var(--c-border);
    border-radius: 8px;
    padding: 2px;
    gap: 2px;
  }

  .view-toggle-btn {
    background: transparent;
    border: none;
    color: var(--c-muted);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.35rem 0.75rem;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }

  .view-toggle-btn:hover {
    color: var(--c-ink);
  }

  .view-toggle-btn.active {
    background: var(--c-surface);
    color: var(--c-cyan);
    border: 1px solid rgba(6, 182, 212, 0.3);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
  }

  /* Conglomerate Quick Actions */
  .conglomerate-actions {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .conglomerate-btn {
    background: var(--c-surface2);
    border: 1px solid var(--c-border);
    color: var(--c-muted);
    font-family: var(--font-mono);
    font-size: 0.7rem;
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .conglomerate-btn:hover {
    color: var(--c-ink);
    border-color: var(--c-cyan);
  }
  .conglomerate-btn.tata:hover {
    border-color: var(--c-amber);
    color: var(--c-amber);
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 0.65rem;
  }

  .nav-btn {
    background: var(--c-surface2);
    color: var(--c-ink);
    border: 1px solid var(--c-border);
    border-radius: 8px;
    padding: 0.4rem 0.85rem;
    font-size: 0.82rem;
    font-weight: 500;
    text-decoration: none;
    transition: all 0.15s ease;
  }
  .nav-btn:hover {
    border-color: var(--c-cyan);
    color: var(--c-cyan);
  }

  .nav-btn-highlight {
    background: var(--c-cyan);
    color: #0a0f1d;
    border-color: var(--c-cyan);
    font-weight: 600;
  }
  .nav-btn-highlight:hover {
    background: #22d3ee;
    border-color: #22d3ee;
    color: #0a0f1d;
  }

  /* -------------------------------------------------------------------------
     RESPONSIVE MULTI-PANEL WORKSTATION LAYOUT
  ------------------------------------------------------------------------- */
  .workstation-container {
    height: calc(100vh - 52px);
    width: 100%;
    display: flex;
    position: relative;
    overflow: hidden;
    background: var(--c-bg);
  }

  /* Panel 1: 3D Stock Nebula */
  .panel-nebula {
    height: 100%;
    flex: 1 1 58%;
    position: relative;
    border-right: 1px solid var(--c-border);
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    background: #0a0f1d;
  }

  /* Panel 2: Streamlit RAG Chatbot */
  .panel-chatbot {
    height: 100%;
    flex: 1 1 42%;
    position: relative;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    background: var(--c-surface2);
    display: flex;
    flex-direction: column;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
  }

  /* Layout View States */
  .workstation-container[data-view="nebula-only"] .panel-nebula {
    flex: 1 1 100%;
    border-right: none;
  }
  .workstation-container[data-view="nebula-only"] .panel-chatbot {
    display: none;
  }

  .workstation-container[data-view="chatbot-only"] .panel-nebula {
    display: none;
  }
  .workstation-container[data-view="chatbot-only"] .panel-chatbot {
    flex: 1 1 100%;
  }

  /* Offline Fallback Card if Streamlit port 8501 is unreachable */
  .chatbot-fallback-hint {
    position: absolute;
    bottom: 12px;
    left: 12px;
    right: 12px;
    background: rgba(15, 23, 42, 0.88);
    backdrop-filter: blur(8px);
    border: 1px solid var(--c-border);
    border-radius: 8px;
    padding: 0.65rem 0.9rem;
    font-size: 0.78rem;
    color: var(--c-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
  }

  @media (max-width: 900px) {
    .conglomerate-actions {
      display: none;
    }
    .workstation-container {
      flex-direction: column;
    }
    .panel-nebula {
      flex: 1 1 50%;
      border-right: none;
      border-bottom: 1px solid var(--c-border);
    }
    .panel-chatbot {
      flex: 1 1 50%;
    }
  }
</style>
</head>
<body>

  <!-- Executive Terminal Header HUD -->
  <header class="terminal-bar">
    <div class="brand-group">
      <div class="brand-icon">📈</div>
      <a href="index.html" class="brand-title">MarketTide AI</a>
      <span style="color:var(--c-muted); font-size:12px;">/</span>
      <span style="color:var(--c-muted); font-size:13px; font-weight:500;">Dual-Engine Workstation</span>
      <span class="terminal-badge">
        <span class="pulse-dot"></span>
        <span>2,766 DISCLOSURES</span>
      </span>
    </div>

    <!-- View Mode Toggles -->
    <div class="view-toggles-strip">
      <button type="button" class="view-toggle-btn active" id="btn-split-view" onclick="setWorkstationView('split')">
        <span>◫ Split View</span>
      </button>
      <button type="button" class="view-toggle-btn" id="btn-nebula-view" onclick="setWorkstationView('nebula-only')">
        <span>🪐 3D Nebula</span>
      </button>
      <button type="button" class="view-toggle-btn" id="btn-chatbot-view" onclick="setWorkstationView('chatbot-only')">
        <span>💬 Chatbot</span>
      </button>
    </div>

    <!-- Conglomerate Quick Directives -->
    <div class="conglomerate-actions">
      <button type="button" class="conglomerate-btn tata" onclick="triggerConglomerate('tata')">Tata Group</button>
      <button type="button" class="conglomerate-btn" onclick="triggerConglomerate('adani')">Adani Group</button>
      <button type="button" class="conglomerate-btn" onclick="triggerConglomerate('reliance')">Reliance</button>
      <button type="button" class="conglomerate-btn" onclick="reset3DView()">Reset</button>
    </div>

    <!-- Navigation Links -->
    <div class="nav-actions">
      <a href="index.html" class="nav-btn">← Overview</a>
      <a href="http://localhost:8501" target="_blank" class="nav-btn nav-btn-highlight">Streamlit App ↗</a>
    </div>
  </header>

  <!-- Responsive Multi-Panel Workstation Layout -->
  <main class="workstation-container" id="workstationShell" data-view="split">
    <!-- Panel 1: Three.js 3D Stock Nebula -->
    <section class="panel-nebula" id="panelNebula" aria-label="3D Stock Nebula Spatial Graph">
      <iframe id="nebulaFrame" src="3d-nebula.html" title="Three.js 3D Stock Nebula" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"></iframe>
    </section>

    <!-- Panel 2: Streamlit RAG Chatbot -->
    <section class="panel-chatbot" id="panelChatbot" aria-label="RAG Regulatory Chatbot">
      <iframe id="chatbotFrame" src="http://localhost:8501/?embed=true" title="MarketTide RAG Intelligence Assistant"></iframe>
      <div class="chatbot-fallback-hint">
        <span>⚡ MarketTide Dual-Engine Bridge Connected (window.MarketTideBus)</span>
        <span style="font-family: var(--font-mono); font-size: 0.72rem; color: var(--c-cyan);">PORT: 8501</span>
      </div>
    </section>
  </main>

  <script>
    // -------------------------------------------------------------------------
    // VIEW TOGGLES CONTROLLER
    // -------------------------------------------------------------------------
    function setWorkstationView(viewMode) {
      const shell = document.getElementById('workstationShell');
      shell.setAttribute('data-view', viewMode);

      document.querySelectorAll('.view-toggle-btn').forEach(btn => btn.classList.remove('active'));
      if (viewMode === 'split') {
        document.getElementById('btn-split-view').classList.add('active');
      } else if (viewMode === 'nebula-only') {
        document.getElementById('btn-nebula-view').classList.add('active');
      } else if (viewMode === 'chatbot-only') {
        document.getElementById('btn-chatbot-view').classList.add('active');
      }

      // Trigger ResizeObserver in embedded 3D scene
      try {
        const nebulaFrame = document.getElementById('nebulaFrame');
        if (nebulaFrame && nebulaFrame.contentWindow) {
          nebulaFrame.contentWindow.dispatchEvent(new Event('resize'));
        }
      } catch (e) {}
    }

    // -------------------------------------------------------------------------
    // CONGLOMERATE QUICK TRIGGERS (Chatbot-to-3D)
    // -------------------------------------------------------------------------
    function triggerConglomerate(group) {
      if (!window.MarketTideBus) return;
      const groupMap = {
        'tata': ['TCS', 'TMPV', 'TATAPOWER', 'TATASTEEL', 'TATACONSUM'],
        'adani': ['ADANIENT', 'ADANIPOWER'],
        'reliance': ['RELIANCE'],
        'mahindra': ['M&M', 'TECHM']
      };
      window.MarketTideBus.emitSceneAction({
        action: 'CLUSTER_CONGLOMERATE',
        conglomerate_group: group,
        target_tickers: groupMap[group] || [],
        visual_directives: {
          glow_color: group === 'tata' ? '#f97316' : '#06b6d4',
          render_connecting_rays: true
        }
      });
    }

    function reset3DView() {
      if (window.MarketTideBus) {
        window.MarketTideBus.emitSceneAction({
          action: 'RESET_VIEW',
          target_tickers: []
        });
      }
    }

    // -------------------------------------------------------------------------
    // BI-DIRECTIONAL EVENT BUS BRIDGE (MarketTideBus)
    // -------------------------------------------------------------------------
    if (window.MarketTideBus) {
      // 1. Click-to-RAG: When a stock is selected in 3D scene
      window.MarketTideBus.on('market-tide:node-select', (detail) => {
        console.log('[Workstation Terminal] Node selected in 3D Nebula:', detail.ticker);

        // Relay to Streamlit RAG iframe
        const chatbotFrame = document.getElementById('chatbotFrame');
        if (chatbotFrame && chatbotFrame.contentWindow) {
          chatbotFrame.contentWindow.postMessage({
            _source: 'MarketTideBus',
            event: 'market-tide:node-select',
            payload: detail,
            timestamp: Date.now()
          }, '*');
        }
      });

      // 2. Chatbot-to-3D: When a scene action directive is issued
      window.MarketTideBus.on('market-tide:scene-action', (directive) => {
        console.log('[Workstation Terminal] Scene action emitted:', directive.action);

        // Relay to 3D Nebula iframe
        const nebulaFrame = document.getElementById('nebulaFrame');
        if (nebulaFrame && nebulaFrame.contentWindow) {
          nebulaFrame.contentWindow.postMessage({
            _source: 'MarketTideBus',
            event: 'market-tide:scene-action',
            payload: directive,
            timestamp: Date.now()
          }, '*');
        }
      });
    }
  </script>
</body>
</html>
